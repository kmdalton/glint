# CXIDB 45 (proteinase K, SACLA BL3, MPCCD, 13 keV; Masuda et al. 2017, 1.20 A, PDB 5KXU), the room
# temperature set. Rings are nearly complete to 1.3 A, so resolution is not edge-limited as in CXIDB 33.
# See config.yaml for what each key means.
data: /pscratch/sd/k/kmdalton/cxidb_45
geom: metadata/ProK.geom                    # the geometry in the deposit's stream; the metadata tarball is gone
raw_dir: raw/ProK-RT
run_glob: 'run*-1'         # a subset: one of each run's three parts, so it spans the whole experiment
wavelength: 0.9494          # 13059 eV, the geometry's photon energy
merge_runtime: 480
merge_mem_mb: 120000
refine_runtime: 240
report_mem_mb: 120000

glint: /pscratch/sd/k/kmdalton/glint
python: /pscratch/sd/k/kmdalton/glint/.mamba/envs/glint/bin/python
crystfel_bin: /pscratch/sd/k/kmdalton/glint/.mamba/envs/crystfel/bin

reference_pdb: reference/5KXU.pdb
rfree_mtz: reference/r-free-flags.mtz

cell: [68.5, 68.5, 108.6, 90, 90, 90]
lattice: tP
space_group: P 43 21 2
adu_per_photon: 10          # 0.000766 ADU/eV at 13 keV
sig_floor: 10
abs_thr: 100
dmin: 1.06                  # integration / merging limit: the detector corner
tol: 0.001                  # Ewald gate, 1/A: keeps 91% of the integrated intensity on a pilot file, with half the predictions of 0.002

integrators: [box, profile, crystfel]
crystfel_lattice: tPc
crystfel_integration: rings-nocen
crystfel_int_radius: 3,4,5  # the authors' radii, from the deposit's stream
point_group: '422'
partialator_iterations: 1
min_cchalf: 0.3
refine_cycles: 5
